# 作用：推送 v* tag 时在一个 job 内依次校验版本、跑测试、编译 CLI 与内嵌 CLI 的 GUI，并把两个 exe 上传到同名 Release；关键机制为版本号取自 internal/version 并先于测试核对，且 GUI 需 embedcli 标签编入 CLI 字节。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # 全部步骤串行放在同一 job：避免每个阶段重新申请 runner、重复 checkout 与安装 Go
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验 tag 与源码版本
        # 唯一来源是 internal/version 包的 Version 常量，两侧统一去掉 v 前缀后比较
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $match = Select-String -Path 'internal\version\*.go' -Pattern 'const\s+Version\s*=\s*"([^"]*)"' | Select-Object -First 1
          if (-not $match) {
            Write-Error "未能从 internal/version 解析出 Version 常量"
            exit 1
          }
          $declared = $match.Matches[0].Groups[1].Value
          if ($declared.TrimStart('v') -ne $env:TAG_NAME.TrimStart('v')) {
            Write-Error "版本不一致：tag 为 $env:TAG_NAME，源码版本为 $declared，请先更新 internal/version 再推 tag"
            exit 1
          }
          Write-Host "版本一致：$declared"

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 单元与端到端测试
        # e2e_test.go 会在临时目录现场编译 CLI 并以子进程执行完整命令集
        run: go test ./...

      - name: 编译命令行主程序
        # 产物与 build.cmd 一致：去符号表、去调试信息，体积更小
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          go build -trimpath -ldflags "-s -w" -o 'dist\BlockSync-CLI.exe' '.\cmd\blocksync'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "命令行主程序编译失败"
            exit 1
          }

      - name: 嵌入主程序并编译界面程序
        # 单文件形态：先把 CLI 复制到 embedded 目录，再由 embedcli 标签经 //go:embed 整体编入 GUI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.\cmd\blocksync-ui\embedded' | Out-Null
          Copy-Item '.\dist\BlockSync-CLI.exe' '.\cmd\blocksync-ui\embedded\BlockSync-CLI.exe' -Force
          go build -trimpath -tags embedcli -ldflags "-H windowsgui -s -w" -o 'dist\BlockSync-GUI.exe' '.\cmd\blocksync-ui'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "界面程序编译失败"
            exit 1
          }

      - name: 验证产物
        # GUI 无控制台窗口且启动即开窗，不能像 CLI 那样跑 --help，改为校验版本自报、体积与冒烟同步
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $cli = 'dist\BlockSync-CLI.exe'
          $gui = 'dist\BlockSync-GUI.exe'
          foreach ($p in @($cli, $gui)) {
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Error "缺少产物 $p"
              exit 1
            }
            if ((Get-Item -LiteralPath $p).Length -lt 1MB) {
              Write-Error "产物体积异常，疑似构建失败：$p"
              exit 1
            }
          }
          $cliLen = (Get-Item -LiteralPath $cli).Length
          $guiLen = (Get-Item -LiteralPath $gui).Length
          if ($guiLen -le $cliLen) {
            Write-Error "界面程序未内嵌主程序：GUI $guiLen 字节不大于 CLI $cliLen 字节"
            exit 1
          }

          # 编译进 exe 的版本必须与 tag 一致，确认常量未被遗漏
          $reported = ((& $cli version) -split '\s+')[-1]
          if ($LASTEXITCODE -ne 0) {
            Write-Error "读取程序版本失败，退出码 $LASTEXITCODE"
            exit 1
          }
          if ($reported.TrimStart('v') -ne $env:TAG_NAME.TrimStart('v')) {
            Write-Error "程序自报版本 $reported 与 tag $env:TAG_NAME 不一致"
            exit 1
          }

          $work = Join-Path $env:RUNNER_TEMP 'blocksync-smoke'
          Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          $src = Join-Path $work 'in'
          $dst = Join-Path $work 'out'
          New-Item -ItemType Directory -Force -Path $src, $dst | Out-Null
          Set-Content -LiteralPath (Join-Path $src 'smoke.txt') -Value 'blocksync release smoke test' -NoNewline
          & '.\dist\BlockSync-CLI.exe' sync $src $dst --yes
          if ($LASTEXITCODE -ne 0) {
            Write-Error "冒烟同步失败，退出码 $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dst 'smoke.txt'))) {
            Write-Error "冒烟同步未产生输出文件"
            exit 1
          }

          Get-Item -LiteralPath $cli, $gui |
            Select-Object Name, @{N='Size_MB';E={[Math]::Round($_.Length/1MB,2)}}, LastWriteTime |
            Format-Table -AutoSize

      - name: 21 项全流程演练
        # 对即将上传的 exe 做合成数据双向往返演练；规模缩到 192 MiB，runner 上约 1-3 分钟
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File 模拟测试.ps1 -FileMB 64 -FileCount 3 -ChangeMB 8

      - name: 重命名产物为带版本号的发布名
        # 资产名带 tag，便于区分版本；校验与演练仍用未改名的 dist 路径
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          foreach ($name in @('BlockSync-CLI', 'BlockSync-GUI')) {
            Move-Item -LiteralPath "dist\$name.exe" -Destination "dist\${name}-$env:TAG_NAME.exe"
          }

      - name: 清理同名 tag 的旧 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --json name 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "发现旧 release, 正在删除..."
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) {
              Write-Error "删除旧 release 失败, 请检查权限或网络"
              exit 1
            }
            Write-Host "已删除旧 release: $tag"
          } else {
            Write-Host "无旧 release ($tag), 跳过清理"
          }
          $LASTEXITCODE = 0

      - name: 上传 exe 到 Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
